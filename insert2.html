        class SoundManager {
            constructor() {
                this.muted = localStorage.getItem('sound_muted') === 'true';
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.hoverSound = { freq: 800, duration: 0.05, type: 'sine' };
                    this.clickSound = { freq: 400, duration: 0.1, type: 'triangle' };
                } catch(e) { console.warn("Audio not supported"); }
            }
            play(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const sound = type === 'hover' ? this.hoverSound : this.clickSound;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = sound.type;
                osc.frequency.setValueAtTime(sound.freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(type === 'hover' ? 0.01 : 0.03, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + sound.duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + sound.duration);
            }
            toggle() {
                this.muted = !this.muted;
                localStorage.setItem('sound_muted', this.muted);
                const icon = document.getElementById('sound-icon');
                if (icon) icon.className = this.muted ? 'fas fa-volume-mute text-xs text-gray-600' : 'fas fa-volume-up text-xs text-gray-400';
                return this.muted;
            }
        }
        const sound = new SoundManager();
        window.toggleSound = () => sound.toggle();

                if (translations[lang] && translations[lang][key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[lang][key];
                    } else {
                        // Preserve icons if any

            const section = document.getElementById('highlights');
            const track = document.getElementById('horizontal-track');
            if (!section || !track) return;
            
            const rect = section.getBoundingClientRect();
            const scrollPercent = -rect.top / (section.offsetHeight - window.innerHeight);
            
            if (scrollPercent >= 0 && scrollPercent <= 1) {

                track.style.transform = `translateX(${-scrollPercent * maxMove}px)`;
